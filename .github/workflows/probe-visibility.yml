name: probe-visibility
on: workflow_dispatch

jobs:
  push-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push a throwaway image
        run: |
          echo "FROM alpine:3.20" > Dockerfile
          docker build -t ghcr.io/devable-dev/lessons/zz-probe:v1 .
          docker push ghcr.io/devable-dev/lessons/zz-probe:v1

  arm-probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: uname -m
